            const handleAddActivity = (e) => {
                e.preventDefault();
                if (!actName || !actDate) return;

                if (actDate === segment.startDate && segment.startTime && actTime && actTime < segment.startTime) {
                    alert(`Activity time cannot be earlier than check-in/arrival (${formatTime(segment.startTime)})`);
                    return;
                }
                if (actDate === segment.endDate && segment.endTime && actTime && actTime > segment.endTime) {
                    alert(`Activity time cannot be later than check-out/departure (${formatTime(segment.endTime)})`);
                    return;
                }

                const newActivity = {
                    id: generateId(),
                    date: actDate,
                    time: actTime,
                    name: actName,
                    price: actPrice ? Number(actPrice) : 0
                };

                const updatedActivities = [...(segment.activities || []), newActivity].sort((a, b) => {
                    const timeA = new Date(`${a.date}T${a.time || '00:00'}`).getTime();
                    const timeB = new Date(`${b.date}T${b.time || '00:00'}`).getTime();
                    return timeA - timeB;
                });
                
                onUpdate({ activities: updatedActivities });

                setActName(''); setActPrice(''); setActTime('');
            };

            const removeActivity = (actId) => {
                const updatedActivities = segment.activities.filter(a => a.id !== actId);
                onUpdate({ activities: updatedActivities });
            };

            const validDates = isCity ? getDaysArray(parseDate(segment.startDate), parseDate(segment.endDate)).map(d => dateToString(d)) : [];

            if (isEditing) {
                return (
                    <div>
                        <div className={`bg-white dark:bg-slate-900 rounded-xl shadow-sm border p-5 ${isCity ? 'border-primary' : 'border-secondary'}`}>
                            <form onSubmit={handleEditSave} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div className="col-span-1 md:col-span-2 lg:col-span-4 mb-2 border-b border-slate-100 dark:border-slate-800 pb-2">
                                    <h3 className="font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                        <IconEdit /> Edit {isCity ? 'Destination' : 'Transit'}
                                    </h3>
                                </div>
                                {isCity ? (
                                    <>
                                        <div className="col-span-1 md:col-span-2">
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">City Name</label>
                                            <input type="text" required value={editName} onChange={e=>setEditName(e.target.value)} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary focus:ring-1 focus:ring-primary" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Check-in Date & Time</label>
                                            <div className="flex gap-2">
                                                <input type="date" required value={editStartDate} onChange={e=>setEditStartDate(e.target.value)} className="w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                                <input type="time" value={editStartTime} onChange={e=>setEditStartTime(e.target.value)} className="w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary px-1" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Check-out Date & Time</label>
                                            <div className="flex gap-2">
                                                <input type="date" required value={editEndDate} onChange={e=>setEditEndDate(e.target.value)} className="w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                                <input type="time" value={editEndTime} onChange={e=>setEditEndTime(e.target.value)} className="w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary px-1" />
                                            </div>
                                        </div>
                                        <div className="col-span-1 md:col-span-2">
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Accommodation Cost ($)</label>
                                            <input type="number" min="0" value={editPrice} onChange={e=>setEditPrice(e.target.value)} placeholder="0" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Method</label>
                                            <select value={editMethod} onChange={e=>setEditMethod(e.target.value)} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary">
                                                <option value="flight">Flight</option>
                                                <option value="train">Train</option>
                                                <option value="bus">Bus</option>
                                                <option value="car">Car Rental</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Route / Name</label>
                                            <input type="text" required value={editName} onChange={e=>setEditName(e.target.value)} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Departure Date & Time</label>
                                            <div className="flex gap-2">
                                                <input type="date" required value={editStartDate} onChange={e=>{setEditStartDate(e.target.value); if(!editEndDate) setEditEndDate(e.target.value);}} className="w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                                <input type="time" value={editStartTime} onChange={e=>setEditStartTime(e.target.value)} className="w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary px-1" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Arrival Date & Time</label>
                                            <div className="flex gap-2">
                                                <input type="date" required value={editEndDate} onChange={e=>setEditEndDate(e.target.value)} className="w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                                <input type="time" value={editEndTime} onChange={e=>setEditEndTime(e.target.value)} className="w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary px-1" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Flight/Train Number (Opt)</label>
                                            <input type="text" value={editFlightNumber} onChange={e=>setEditFlightNumber(e.target.value)} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Total Cost ($)</label>
                                            <input type="number" min="0" value={editPrice} onChange={e=>setEditPrice(e.target.value)} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                        </div>
                                    </>
                                )}
                                <div className="col-span-1 md:col-span-2 lg:col-span-4 flex justify-end gap-3 mt-2">
                                    <button type="button" onClick={() => setIsEditing(false)} className="px-4 py-2 text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors">Cancel</button>
                                    <button type="submit" className={`px-6 py-2 rounded-lg text-sm font-semibold text-white shadow-sm transition-colors ${isCity ? 'bg-primary hover:bg-indigo-700' : 'bg-secondary hover:bg-pink-600'}`}>
                                        Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`bg-white dark:bg-slate-900 rounded-xl shadow-sm border overflow-hidden ${isCity ? 'border-indigo-100 dark:border-slate-800' : 'border-pink-100 dark:border-slate-800'}`}>
                    <div className={`p-4 flex items-center justify-between cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors ${isCity ? '' : 'bg-pink-50/30 dark:bg-pink-950/20'}`} onClick={() => setIsOpen(!isOpen)}>
                        <div className="flex items-center gap-4">
                            <div className={`w-10 h-10 min-w-[40px] rounded-full flex items-center justify-center text-white shadow-sm ${isCity ? 'bg-primary' : 'bg-secondary'}`}>
                                {isCity ? <IconMapPin /> : (segment.method === 'train' ? <IconTrain className="w-5 h-5 text-white" /> : (segment.method === 'bus' ? <IconBus className="w-5 h-5 text-white" /> : (segment.method === 'car' ? <IconCar className="w-5 h-5 text-white" /> : <IconPlane className="w-5 h-5 text-white" />)))}
                            </div>
                            <div>
                                <h3 className="font-bold text-slate-800 dark:text-slate-100 text-lg">{segment.name}</h3>
                                <p className="text-sm text-slate-500 dark:text-slate-400 font-medium flex items-center flex-wrap gap-1">
                                    <span>{formatDate(parseDate(segment.startDate))} {segment.startTime ? formatTime(segment.startTime) : ''}</span>
                                    {segment.startDate !== segment.endDate && <span> - {formatDate(parseDate(segment.endDate))}</span>}
                                    {segment.endTime && <span> {formatTime(segment.endTime)}</span>}
                                    {!isCity && segment.flightNumber && <span className="ml-2 px-2 py-0.5 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded text-xs font-mono">{segment.flightNumber}</span>}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1 sm:gap-3">
                            {segment.price > 0 && <span className="font-semibold text-slate-700 dark:text-slate-300 hidden sm:inline-block">${segment.price}</span>}
                            <button onClick={(e) => { e.stopPropagation(); startEditing(); }} className="p-2 text-slate-400 hover:text-primary transition-colors" title="Edit">
                                <IconEdit />
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); onRemove(); }} className="p-2 text-slate-400 hover:text-red-500 transition-colors" title="Delete">
                                <IconTrash />
                            </button>
                            <div className="text-slate-400 p-2">
                                {isOpen ? <IconChevronUp /> : <IconChevronDown />}
                            </div>
                        </div>
                    </div>

                    {isOpen && isCity && (
                        <div className="border-t border-indigo-50 dark:border-slate-800 p-5 bg-slate-50/50 dark:bg-slate-950/40">
                            <div className="mb-6">
                                <h4 className="font-bold text-slate-700 dark:text-slate-200 mb-3 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-primary"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                    Planned Activities
                                </h4>
                                
                                {segment.activities && segment.activities.length > 0 ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {segment.activities.map(act => (
                                            <div key={act.id} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg p-3 flex justify-between items-center shadow-sm">
                                                <div>
                                                    <div className="text-xs font-bold text-primary mb-0.5">
                                                        {formatDate(parseDate(act.date))} {act.time && `• ${formatTime(act.time)}`}
                                                    </div>
                                                    <div className="text-sm font-medium text-slate-800 dark:text-slate-200">{act.name}</div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    {act.price > 0 && <span className="text-sm font-bold text-slate-600 dark:text-slate-400">${act.price}</span>}
                                                    <button onClick={() => removeActivity(act.id)} className="text-slate-400 hover:text-red-500"><IconTrash /></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <p className="text-sm text-slate-500 dark:text-slate-400 italic">No activities planned yet.</p>
                                )}
                            </div>

                            <form onSubmit={handleAddActivity} className="bg-white dark:bg-slate-900 p-4 rounded-lg border border-slate-200 dark:border-slate-800 shadow-sm">
                                <h5 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">Add New Activity</h5>
                                <div className="flex flex-col md:flex-row gap-3 items-end">
                                    <div className="w-full md:w-1/5">
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Date</label>
                                        <select required value={actDate} onChange={e=>setActDate(e.target.value)} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded p-2 text-sm outline-none focus:border-primary">
                                            {validDates.map(d => <option key={d} value={d}>{formatDate(parseDate(d))}</option>)}
                                        </select>
                                    </div>
                                    <div className="w-full md:w-1/5">
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Time</label>
                                        <input type="time" value={actTime} onChange={e=>setActTime(e.target.value)} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded p-2 text-sm outline-none focus:border-primary" />
                                    </div>
                                    <div className="w-full md:w-2/5">
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Activity Description</label>
                                        <input type="text" required value={actName} onChange={e=>setActName(e.target.value)} placeholder="e.g. Museum visit" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded p-2 text-sm outline-none focus:border-primary" />
                                    </div>
                                    <div className="w-full md:w-1/5">
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Price ($)</label>
                                        <input type="number" min="0" value={actPrice} onChange={e=>setActPrice(e.target.value)} placeholder="0" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded p-2 text-sm outline-none focus:border-primary" />
                                    </div>
                                    <div className="w-full md:w-auto mt-2 md:mt-0">
                                        <button type="submit" className="w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white font-medium text-sm px-4 py-2 rounded transition-colors whitespace-nowrap">
                                            Add
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
