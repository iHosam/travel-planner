<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WanderPlan – Trip Planner</title>
  <meta name="description" content="Plan a trip day by day: stays, travel, activities and costs on one calm timeline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3Cpath d='M9 22 23 9m0 0h-9m9 0v9' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Apply a saved appearance before first paint so there is no flash. -->
  <script>
    try {
      var theme = JSON.parse(localStorage.getItem('wanderplan:v3')).prefs.theme;
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="modulepreload" href="vendor/htm-preact.js">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript>WanderPlan needs JavaScript to run.</noscript>
</body>
</html>
