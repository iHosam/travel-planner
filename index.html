        tailwind.config = {
            darkMode: 'class',

                extend: {
                    colors: {

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar for the Gantt Chart */
        .gantt-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .gantt-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .gantt-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .gantt-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .sticky-col { position: sticky; left: 0; z-index: 30; }
        .sticky-header { position: sticky; top: 0; z-index: 10; }
        .sticky-corner { position: sticky; top: 0; left: 0; z-index: 40; }

        /* Explicit right-border color overrides to match activity entry top bars */
        .border-r-primary { border-right-color: #4f46e5 !important; }
        .border-r-secondary { border-right-color: #ec4899 !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SVG Icons ---
        const IconPlane = ({ className = "w-4 h-4" }) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.6L3 8l5 5-3 3-3-.9L3 17l4.5 1.5L9 23l1.9-2-.9-3 3-3 5 5c.4-.2.7-.6.6-1.1z"/></svg>;
        const IconTrain = ({ className = "w-4 h-4" }) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><path d="M8 15h0"/><path d="M16 15h0"/></svg>;
        const IconBus = ({ className = "w-4 h-4" }) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M8 15h.01"/><path d="M16 15h.01"/><path d="m6 19-2 2"/><path d="m18 21-2-2"/></svg>;
        const IconMapPin = ({ className = "w-4 h-4" }) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconCar = ({ className = "w-4 h-4" }) => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>;
        const IconChevronDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>;
        const IconChevronUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>;
        const IconZoomIn = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>;
        const IconZoomOut = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
        const IconMoon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;

        // --- Utility Functions ---
        const generateId = () => Math.random().toString(36).substring(2, 11);
        
        const parseDate = (dateStr) => {
            if (!dateStr) return new Date();
            const [y, m, d] = dateStr.split('-');
            return new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10), 12, 0, 0);
        };

        const formatDate = (date) => {
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        };

        const getDaysArray = (start, end) => {
            const arr = [];
            let dt = new Date(start);
            dt.setHours(12, 0, 0, 0);
            const targetEnd = new Date(end);
            targetEnd.setHours(12, 0, 0, 0);

            while (dt <= targetEnd) {
                arr.push(new Date(dt));
                dt.setDate(dt.getDate() + 1);
            }
            return arr;
        };

        const dateToString = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const formatTime = (timeStr) => {
            if (!timeStr) return '';
            const [h, m] = timeStr.split(':');
            const d = new Date();
            d.setHours(parseInt(h, 10), parseInt(m, 10));
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        };

        const parseCSV = (text) => {
            const lines = text.split(/\r?\n/);
            return lines.map(line => {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && line[i+1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        result.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current);
                return result;
            });
        };

        const escapeCSV = (str) => {
            if (str === null || str === undefined) return '';
            const s = String(str);
            if (s.includes(',') || s.includes('"') || s.includes('\n')) {
                return `"${s.replace(/"/g, '""')}"`;
            }
            return s;
        };

        const initialSegments = [
            { 
                id: '1', type: 'city', name: 'Tokyo', 
                startDate: '2026-10-15', startTime: '14:00', 
                endDate: '2026-10-20', endTime: '08:00', 
                price: 0,
                activities: [
                    { id: 't1', date: '2026-10-15', time: '16:00', name: 'Arrival & Shinjuku Neon Lights', price: 0 },
                    { id: 't2', date: '2026-10-16', time: '10:00', name: 'Shibuya Crossing & Meiji Shrine', price: 15 },
                    { id: 't3', date: '2026-10-17', time: '11:00', name: 'Akihabara Electronics & Anime', price: 40 },
                    { id: 't4', date: '2026-10-18', time: '09:00', name: 'Senso-ji Temple & Tokyo Skytree', price: 25 },
                    { id: 't5', date: '2026-10-19', time: '08:30', name: 'Tsukiji Outer Market & Ginza Shopping', price: 60 },
                ] 
            },
            { 
                id: '2', type: 'transit', method: 'train', name: 'Tokyo to Kyoto', flightNumber: 'Nozomi 215',
                startDate: '2026-10-20', startTime: '09:00', 
                endDate: '2026-10-20', endTime: '11:15', price: 95 
            },
            { 
                id: '3', type: 'city', name: 'Kyoto', 
                startDate: '2026-10-20', startTime: '12:00', 
                endDate: '2026-10-24', endTime: '09:00', 
                price: 0,
                activities: [
                    { id: 'k1', date: '2026-10-20', time: '14:00', name: 'Kinkaku-ji (Golden Pavilion)', price: 10 },
                    { id: 'k2', date: '2026-10-21', time: '07:30', name: 'Fushimi Inari Taisha Shrine', price: 0 },
                    { id: 'k3', date: '2026-10-22', time: '08:00', name: 'Arashiyama Bamboo Grove & Monkey Park', price: 12 },
                    { id: 'k4', date: '2026-10-23', time: '18:00', name: 'Gion District Traditional Walk & Dinner', price: 80 },
                ] 
            },
            { 
                id: '4', type: 'transit', method: 'bus', name: 'Kyoto to Osaka', flightNumber: 'Keihan Express Bus',
                startDate: '2026-10-24', startTime: '10:00', 
                endDate: '2026-10-24', endTime: '11:15', price: 15 
            },
            { 
                id: '5', type: 'city', name: 'Osaka', 
                startDate: '2026-10-24', startTime: '12:00', 
                endDate: '2026-10-29', endTime: '11:00', 
                price: 0,
                activities: [
                    { id: 'o1', date: '2026-10-24', time: '18:00', name: 'Dotonbori Street Food Tour', price: 50 },
                    { id: 'o2', date: '2026-10-25', time: '08:00', name: 'Universal Studios Japan & Nintendo World', price: 110 },
                    { id: 'o3', date: '2026-10-26', time: '10:00', name: 'Osaka Castle & Nishinomaru Garden', price: 15 },
                    { id: 'o4', date: '2026-10-27', time: '11:00', name: 'Umeda Sky Building Observatory', price: 20 },
                    { id: 'o5', date: '2026-10-28', time: '09:00', name: 'Day Trip: Nara Deer Park & Todai-ji', price: 35 },
                ] 
            },
            { 
                id: '6', type: 'transit', method: 'flight', name: 'Osaka to Riyadh', flightNumber: 'EK317',
                startDate: '2026-10-29', startTime: '14:00', 
                endDate: '2026-10-29', endTime: '22:30', price: 850 
            }
        ];

        const QuickEditModal = ({ config, segments, onClose, onUpdateSegment, onAddSegment }) => {
            const segment = config.type !== 'add-segment' ? segments.find(s => s.id === config.segmentId) : null;
            if (config.type !== 'add-segment' && !segment) return null;

            const [formData, setFormData] = useState(() => {
                if (config.type === 'edit-segment') {
                    return { ...segment };
                } else if (config.type === 'add-segment') {
                    return { type: 'city', name: '', startDate: config.startDate, startTime: config.startTime, endDate: config.startDate, endTime: '', method: 'flight', flightNumber: '', price: '' };
                } else if (config.type === 'edit-activity') {
                    const act = segment?.activities?.find(a => a.id === config.activityId) || {};
                    return { ...act };
                } else if (config.type === 'add-activity') {
                    return { date: config.date, time: '', name: '', price: '' };
                }
                return {};
            });

            const currentIsCity = config.type === 'add-segment' 
                ? (formData.type === 'city') 
                : (segment?.type === 'city');

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (config.type.includes('activity')) {
                    if (formData.date < segment.startDate || formData.date > segment.endDate) {
                        alert(`Activity date must be between ${segment.startDate} and ${segment.endDate}`);
                        return;
                    }
                    if (formData.date === segment.startDate && segment.startTime && formData.time && formData.time < segment.startTime) {
                        alert(`Activity time cannot be earlier than check-in/arrival (${formatTime(segment.startTime)})`);
                        return;
                    }
                    if (formData.date === segment.endDate && segment.endTime && formData.time && formData.time > segment.endTime) {
                        alert(`Activity time cannot be later than check-out/departure (${formatTime(segment.endTime)})`);
                        return;
                    }
                }

                if (config.type === 'edit-segment') {
                    const updates = {
                        name: formData.name,
                        startDate: formData.startDate,
                        startTime: formData.startTime,
                        endDate: formData.endDate,
                        endTime: formData.endTime,
                        price: formData.price ? Number(formData.price) : 0
                    };
                    if (!currentIsCity) {
                        updates.method = formData.method;
                        updates.flightNumber = formData.flightNumber;
                    }
                    onUpdateSegment(segment.id, updates);
                } else if (config.type === 'add-segment') {
                    const newSeg = {
                        id: generateId(),
                        type: formData.type,
                        name: formData.name,
                        startDate: formData.startDate,
                        startTime: formData.startTime,
                        endDate: formData.endDate,
                        endTime: formData.endTime,
                        price: formData.price ? Number(formData.price) : 0,
                        activities: []
                    };
                    if (!currentIsCity) {
                        newSeg.method = formData.method || 'flight';
                        newSeg.flightNumber = formData.flightNumber;
                    }
                    onAddSegment(newSeg);
                } else if (config.type === 'edit-activity') {
                    const updatedActivities = segment.activities.map(a => 
                        a.id === config.activityId ? { ...a, ...formData, price: Number(formData.price)||0 } : a
                    );
                    onUpdateSegment(segment.id, { 
                        activities: updatedActivities.sort((a, b) => new Date(`${a.date}T${a.time || '00:00'}`).getTime() - new Date(`${b.date}T${b.time || '00:00'}`).getTime())
                    });
                } else if (config.type === 'add-activity') {
                    const newAct = { ...formData, id: generateId(), price: Number(formData.price)||0 };
                    const updatedActivities = [...(segment.activities || []), newAct].sort((a, b) => 
                        new Date(`${a.date}T${a.time || '00:00'}`).getTime() - new Date(`${b.date}T${b.time || '00:00'}`).getTime())
                    ;
                    onUpdateSegment(segment.id, { activities: updatedActivities });
                }
                onClose();
            };

            const handleDeleteActivity = () => {
                if (config.type === 'edit-activity') {
                    const updatedActivities = segment.activities.filter(a => a.id !== config.activityId);
                    onUpdateSegment(segment.id, { activities: updatedActivities });
                    onClose();
                }
            };

            const focusBorderClass = currentIsCity ? 'focus:border-primary' : 'focus:border-secondary';

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white dark:bg-slate-900 border dark:border-slate-800 rounded-2xl shadow-xl w-full max-w-lg overflow-hidden animate-fade-in" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center p-4 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                            <h3 className="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                {config.type === 'edit-segment' ? <><IconEdit/> Edit {currentIsCity ? 'Destination' : 'Transit'}</> : ''}
                                {config.type === 'add-segment' ? <><IconPlus/> Add {currentIsCity ? 'Destination' : 'Transit'}</> : ''}
                                {config.type === 'edit-activity' ? <><IconEdit/> Edit Activity</> : ''}
                                {config.type === 'add-activity' ? <><IconPlus/> Add Activity</> : ''}
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded p-1 shadow-sm transition-colors"><IconX /></button>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="p-5">
                            {(config.type === 'edit-segment' || config.type === 'add-segment') && (
                                <div className="grid grid-cols-2 gap-4">
                                    {config.type === 'add-segment' && (
                                        <div className="col-span-2 flex gap-4 mb-2 border-b border-slate-200 dark:border-slate-800 pb-2">
                                            <button type="button" onClick={() => setFormData(prev => ({...prev, type: 'city'}))} className={`pb-2 font-medium text-sm transition-colors border-b-2 ${formData.type === 'city' ? 'border-primary text-primary' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800'}`}>
                                                Add Destination
                                            </button>
                                            <button type="button" onClick={() => setFormData(prev => ({...prev, type: 'transit'}))} className={`pb-2 font-medium text-sm transition-colors border-b-2 ${formData.type === 'transit' ? 'border-secondary text-secondary' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800'}`}>
                                                Add Travel / Transit
                                            </button>
                                        </div>
                                    )}
                                    {!currentIsCity && (
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Method</label>
                                            <select name="method" value={formData.method || 'flight'} onChange={handleChange} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary">
                                                <option value="flight">Flight</option>
                                                <option value="train">Train</option>
                                                <option value="bus">Bus</option>
                                                <option value="car">Car Rental</option>
                                            </select>
                                        </div>
                                    )}
                                    <div className={`col-span-2 ${!currentIsCity ? 'sm:col-span-1' : ''}`}>
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">{currentIsCity ? 'City Name' : 'Route / Name'}</label>
                                        <input name="name" value={formData.name || ''} onChange={handleChange} required className={`w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none ${focusBorderClass}`} />
                                    </div>
                                    
                                    <div className="col-span-2">
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Start Date & Time</label>
                                        <div className="flex gap-2">
                                            <input type="date" name="startDate" value={formData.startDate || ''} onChange={handleChange} required className={`w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none ${focusBorderClass}`} />
                                            <input type="time" name="startTime" value={formData.startTime || ''} onChange={handleChange} className={`w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none ${focusBorderClass} px-1`} />
                                        </div>
                                    </div>
                                    <div className="col-span-2">
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">End Date & Time</label>
                                        <div className="flex gap-2">
                                            <input type="date" name="endDate" value={formData.endDate || ''} onChange={handleChange} required className={`w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none ${focusBorderClass}`} />
                                            <input type="time" name="endTime" value={formData.endTime || ''} onChange={handleChange} className={`w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none ${focusBorderClass} px-1`} />
                                        </div>
                                    </div>

                                    {!currentIsCity ? (
                                        <>
                                            <div className="col-span-2 sm:col-span-1">
                                                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Flight/Train Num</label>
                                                <input name="flightNumber" value={formData.flightNumber || ''} onChange={handleChange} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                            </div>
                                            <div className="col-span-2 sm:col-span-1">
                                                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Price ($)</label>
                                                <input type="number" min="0" name="price" value={formData.price || ''} onChange={handleChange} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                            </div>
                                        </>
                                    ) : (
                                        <div className="col-span-2">
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Accommodation Cost ($)</label>
                                            <input type="number" min="0" name="price" value={formData.price || ''} onChange={handleChange} placeholder="0" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                        </div>
                                    )}
                                </div>
                            )}

                            {config.type.includes('activity') && (
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="col-span-2">
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Activity Name</label>
                                        <input name="name" value={formData.name || ''} onChange={handleChange} required placeholder="e.g. Museum Visit" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Date</label>
                                        <input type="date" name="date" value={formData.date || ''} onChange={handleChange} min={segment.startDate} max={segment.endDate} required className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Time</label>
                                        <input type="time" name="time" value={formData.time || ''} onChange={handleChange} min={formData.date === segment.startDate ? segment.startTime : undefined} max={formData.date === segment.endDate ? segment.endTime : undefined} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary px-1" />
                                    </div>
                                    <div className="col-span-2">
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Price ($)</label>
                                        <input type="number" min="0" name="price" value={formData.price || ''} onChange={handleChange} placeholder="0" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                    </div>
                                </div>
                            )}

                            <div className="mt-6 flex justify-end items-center gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                                {config.type === 'edit-activity' && (
                                    <button type="button" onClick={handleDeleteActivity} className="mr-auto text-red-500 text-sm font-semibold hover:text-red-700 flex items-center gap-1"><IconTrash/> Delete</button>
                                )}
                                <button type="button" onClick={onClose} className="px-4 py-2 text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors">Cancel</button>
                                <button type="submit" className={`px-6 py-2 rounded-lg text-sm font-semibold text-white shadow-sm transition-colors ${((config.type === 'edit-segment' || config.type === 'add-segment') && !currentIsCity) ? 'bg-secondary hover:bg-pink-600' : 'bg-primary hover:bg-indigo-700'}`}>
                                    Save
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [segments, setSegments] = useState(initialSegments);
            const [isZoomedOut, setIsZoomedOut] = useState(false);
            const [modalConfig, setModalConfig] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(false);
            const fileInputRef = React.useRef(null);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const { timeline, minDate, maxDate } = useMemo(() => {
                if (segments.length === 0) return { timeline: [], minDate: null, maxDate: null };
                
                let min = parseDate(segments[0].startDate);
                let max = parseDate(segments[0].endDate);
                
                segments.forEach(seg => {
                    const s = parseDate(seg.startDate);
                    const e = parseDate(seg.endDate);
                    if (s < min) min = s;
                    if (e > max) max = e;
                });
                
                const paddedMin = new Date(min); paddedMin.setDate(paddedMin.getDate() - 1);
                const paddedMax = new Date(max); paddedMax.setDate(paddedMax.getDate() + 1);

                return {
                    minDate: paddedMin,
                    maxDate: paddedMax,
                    timeline: getDaysArray(paddedMin, paddedMax)
                };
            }, [segments]);

            const { totalCost, totalDays } = useMemo(() => {
                let cost = 0;
                segments.forEach(seg => {
                    if (seg.price) cost += Number(seg.price);
                    if (seg.activities) {
                        seg.activities.forEach(act => {
                            if (act.price) cost += Number(act.price);
                        });
                    }
                });
                const days = timeline.length > 2 ? timeline.length - 2 : 0;
                return { totalCost: cost, totalDays: days };
            }, [segments, timeline]);

            const addSegment = (newSegment) => {
                setSegments(prev => [...prev, newSegment].sort((a, b) => {
                    const timeA = new Date(`${a.startDate}T${a.startTime || '00:00'}`).getTime();
                    const timeB = new Date(`${b.startDate}T${b.startTime || '00:00'}`).getTime();
                    return timeA - timeB;
                }));
            };

            const removeSegment = (id) => {
                setSegments(prev => prev.filter(s => s.id !== id));
            };

            const updateSegment = (id, updatedData) => {
                setSegments(prev => {
                    const updated = prev.map(s => s.id === id ? { ...s, ...updatedData } : s);
                    return updated.sort((a, b) => {
                        const timeA = new Date(`${a.startDate}T${a.startTime || '00:00'}`).getTime();
                        const timeB = new Date(`${b.startDate}T${b.startTime || '00:00'}`).getTime();
                        return timeA - timeB;
                    });
                });
            };

            const handleExportCSV = () => {
                const headers = ['RowLevel', 'SegmentID', 'ActivityID', 'SegmentType', 'Name', 'StartDate', 'StartTime', 'EndDate', 'EndTime', 'Method', 'FlightNumber', 'Price'];
                const rows = [headers];

                segments.forEach(seg => {
                    rows.push([
                        'Segment', escapeCSV(seg.id), '', escapeCSV(seg.type), escapeCSV(seg.name), 
                        escapeCSV(seg.startDate), escapeCSV(seg.startTime || ''), escapeCSV(seg.endDate), 
                        escapeCSV(seg.endTime || ''), escapeCSV(seg.method || ''), escapeCSV(seg.flightNumber || ''), escapeCSV(seg.price || 0)
                    ]);

                    if (seg.activities) {
                        seg.activities.forEach(act => {
                            rows.push([
                                'Activity', escapeCSV(seg.id), escapeCSV(act.id), '', escapeCSV(act.name), 
                                escapeCSV(act.date), escapeCSV(act.time || ''), '', '', '', '', escapeCSV(act.price || 0)
                            ]);
                        });
                    }
                });

                const csvContent = rows.map(e => e.join(',')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', 'wanderplan_itinerary.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImportCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = parseCSV(text);
                    if (lines.length < 2) return;

                    const newSegments = [];
                    let currentSegments = {}; 

                    for (let i = 1; i < lines.length; i++) {
                        const row = lines[i];
                        if (row.length < 12 || !row[0]) continue; 

                        const [rowLevel, segmentId, activityId, segmentType, name, startDate, startTime, endDate, endTime, method, flightNumber, priceStr] = row;
                        const price = Number(priceStr) || 0;

                        if (rowLevel === 'Segment') {
                            const seg = {
                                id: segmentId || generateId(),
                                type: segmentType,
                                name: name,
                                startDate: startDate,
                                startTime: startTime,
                                endDate: endDate,
                                endTime: endTime,
                                price: price,
                                activities: []
                            };
                            if (segmentType === 'transit') {
                                seg.method = method;
                                seg.flightNumber = flightNumber;
                            }
                            currentSegments[seg.id] = seg;
                            newSegments.push(seg);
                        } else if (rowLevel === 'Activity') {
                            const act = {
                                id: activityId || generateId(),
                                date: startDate,
                                time: startTime,
                                name: name,
                                price: price
                            };
                            if (currentSegments[segmentId]) {
                                currentSegments[segmentId].activities.push(act);
                            }
                        }
                    }
                    
                    setSegments(newSegments.sort((a, b) => {
                        const timeA = new Date(`${a.startDate}T${a.startTime || '00:00'}`).getTime();
                        const timeB = new Date(`${b.startDate}T${b.startTime || '00:00'}`).getTime();
                        return timeA - timeB;
                    }));
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const formatICSDate = (dateStr, timeStr) => {
                if (!dateStr) return '';
                const datePart = dateStr.replace(/-/g, '');
                let timePart = '000000';
                if (timeStr) {
                    timePart = timeStr.replace(':', '') + '00';
                }
                return `${datePart}T${timePart}`;
            };

            const handleExportICS = () => {
                let icsLines = [
                    'BEGIN:VCALENDAR',
                    'VERSION:2.0',
                    'PRODID:-//WanderPlan//Itinerary//EN',
                    'CALSCALE:GREGORIAN',
                    'METHOD:PUBLISH'
                ];

                const addEvent = (uid, start, end, summary, description, location = '') => {
                    icsLines.push('BEGIN:VEVENT');
                    icsLines.push(`UID:${uid}@wanderplan.com`);
                    icsLines.push(`DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`);
                    icsLines.push(`DTSTART:${start}`);
                    icsLines.push(`DTEND:${end}`);
                    icsLines.push(`SUMMARY:${summary}`);
                    icsLines.push(`DESCRIPTION:${description}`);
                    if (location) icsLines.push(`LOCATION:${location}`);
                    icsLines.push('END:VEVENT');
                };

                segments.forEach(seg => {
                    const segStart = formatICSDate(seg.startDate, seg.startTime || '00:00');
                    const segEnd = formatICSDate(seg.endDate, seg.endTime || '23:59');
                    
                    if (seg.type === 'transit') {
                        const flightInfo = seg.flightNumber ? ` (${seg.flightNumber})` : '';
                        addEvent(seg.id, segStart, segEnd, `Travel: ${seg.name}${flightInfo}`, `Method: ${seg.method}\\nPrice: $${seg.price}`);
                    } else {
                        addEvent(seg.id, segStart, segEnd, `Stay in ${seg.name}`, `City stay\\nTotal Cost: $${seg.price}`, seg.name);
                        
                        if (seg.activities) {
                            seg.activities.forEach(act => {
                                const actStart = formatICSDate(act.date, act.time || '00:00');
                                let actEnd = actStart;
                                if (act.time) {
                                    const endDate = new Date(`${act.date}T${act.time}`);
                                    endDate.setHours(endDate.getHours() + 1);
                                    const eDateStr = dateToString(endDate);
                                    const eTimeStr = String(endDate.getHours()).padStart(2, '0') + ':' + String(endDate.getMinutes()).padStart(2, '0');
                                    actEnd = formatICSDate(eDateStr, eTimeStr);
                                } else {
                                    actEnd = formatICSDate(act.date, '23:59'); 
                                }
                                
                                addEvent(act.id, actStart, actEnd, act.name, `Activity in ${seg.name}\\nPrice: $${act.price}`, seg.name);
                            });
                        }
                    }
                });

                icsLines.push('END:VCALENDAR');
                
                const blob = new Blob([icsLines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', 'wanderplan_itinerary.ics');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="min-h-screen flex flex-col relative pb-32">
                    {/* Header */}
                    <header className="bg-white dark:bg-slate-900 shadow-sm border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-0 z-40">
                        <div className="flex items-center gap-2 w-full sm:w-auto">
                            <div className="bg-primary text-white p-2 rounded-lg"><IconPlane className="w-5 h-5" /></div>
                            <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">WanderPlan</h1>
                        </div>
                        <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                            <div className="flex items-center gap-2 mr-auto sm:mr-4">
                                <input type="file" accept=".csv" ref={fileInputRef} onChange={handleImportCSV} className="hidden" />
                                <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md transition-colors border border-slate-200 dark:border-slate-700">
                                    <IconUpload /> Import CSV
                                </button>
                                <button onClick={handleExportCSV} className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md transition-colors border border-slate-200 dark:border-slate-700">
                                    <IconDownload /> Export CSV
                                </button>
                                <button onClick={handleExportICS} className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-primary hover:bg-indigo-700 text-white rounded-md transition-colors shadow-sm">
                                    <IconDownload /> Calendar
                                </button>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors border border-slate-200 dark:border-slate-700" title="Toggle Theme">
                                    {isDarkMode ? <IconSun /> : <IconMoon />}
                                </button>
                            </div>
                            <div className="bg-slate-100 dark:bg-slate-800 px-4 py-2 rounded-full text-sm font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-2">
                                <span>{totalDays} Days Total</span>
                            </div>
                            <div className="bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-400 px-4 py-2 rounded-full text-sm font-bold border border-emerald-200 dark:border-emerald-800/60 flex items-center gap-1">
                                Total Cost: ${totalCost.toLocaleString()}
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow p-6 flex flex-col gap-8 max-w-7xl mx-auto w-full">
                        
                        {/* Gantt Chart Section */}
                        <section className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col">
                            <div className="p-4 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 flex justify-between items-center">
                                <h2 className="font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-primary"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                                    Trip Timeline
                                </h2>
                                {timeline.length > 0 && (
                                    <button 
                                        onClick={() => setIsZoomedOut(!isZoomedOut)}
                                        className="flex items-center gap-1.5 px-3 py-1.5 text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors shadow-sm font-medium"
                                    >
                                        {isZoomedOut ? <><IconZoomIn /> Zoom In</> : <><IconZoomOut /> Zoom Out</>}
                                    </button>
                                )}
                            </div>
                            
                            {timeline.length > 0 ? (
                                <GanttChart timeline={timeline} segments={segments} isZoomedOut={isZoomedOut} onOpenModal={setModalConfig} onAddSegment={addSegment} />
                            ) : (
                                <div className="p-12 text-center text-slate-400">
                                    <IconMapPin className="mx-auto w-12 h-12 mb-3 opacity-50" />
                                    <p>No destinations added yet. Start planning below!</p>
                                </div>
                            )}
                        </section>

                        {/* Input Section */}
                        <section className="mt-4">
                            <SegmentManager 
                                segments={segments} 
                                onAddSegment={addSegment} 
                                onRemoveSegment={removeSegment}
                                onUpdateSegment={updateSegment}
                            />
                        </section>
                    </main>

                    {/* Interactive Modal */}
                    {modalConfig && (
                        <QuickEditModal 
                            key={`${modalConfig.type}-${modalConfig.segmentId || 'new'}-${modalConfig.activityId||''}`}
                            config={modalConfig}
                            segments={segments}
                            onClose={() => setModalConfig(null)}
                            onUpdateSegment={updateSegment}
                            onAddSegment={addSegment}
                        />
                    )}
                </div>
            );
        };

        const GanttChart = ({ timeline, segments, isZoomedOut, onOpenModal, onAddSegment }) => {
            const firstCol = isZoomedOut ? '100px' : '200px';
            const dayCols = isZoomedOut ? `repeat(${timeline.length}, minmax(0, 1fr))` : `repeat(${timeline.length}, minmax(140px, 1fr))` ;
            const gridTemplateColumns = `${firstCol} ${dayCols}`;

            const getTransitIcon = (method) => {
                switch(method) {
                    case 'train': return <IconTrain className="w-5 h-5 text-secondary" />;
                    case 'car': return <IconCar className="w-5 h-5 text-amber-500" />;
                    case 'bus': return <IconBus className="w-5 h-5 text-emerald-500" />;
                    default: return <IconPlane className="w-5 h-5 text-secondary" />;
                }
            };

            return (
                <div className={`overflow-x-auto gantt-scroll w-full bg-white dark:bg-slate-900 relative`}>
                    <div className={`pb-6 ${isZoomedOut ? 'w-full' : 'min-w-max'}`} style={{ display: 'grid', gridTemplateColumns }}>
                        
                        {/* Header Row */}
                        <div className={`sticky-corner ${isZoomedOut ? 'p-1.5 text-[10px]' : 'p-3 text-sm'} font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider flex items-center overflow-hidden bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 border-r-4 border-r-primary`}>
                            <span className="truncate">Destination</span>
                        </div>
                        {timeline.map((date, i) => (
                            <div key={i} className={`sticky-header ${isZoomedOut ? 'p-1' : 'p-3'} border-r border-b border-slate-200 dark:border-slate-800 flex flex-col justify-center items-center overflow-hidden bg-white dark:bg-slate-900`}>
                                <span className={`text-[10px] sm:text-xs text-slate-400 dark:text-slate-500 font-medium uppercase truncate w-full text-center ${isZoomedOut ? 'text-[8px] sm:text-[9px]' : ''}`}>{date.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                                <span className={`${isZoomedOut ? 'text-[9px] sm:text-[10px]' : 'text-sm'} font-bold text-slate-700 dark:text-slate-200 truncate w-full text-center`}>{formatDate(date)}</span>
                            </div>
                        ))}

                        {/* Data Rows */}
                        {segments.map((segment) => {
                            const isTransit = segment.type === 'transit';
                            
                            return (
                                <React.Fragment key={segment.id}>
                                    {/* Left Sticky Column (Label) */}
                                    <div 
                                        className={`sticky-col ${isZoomedOut ? 'p-1.5' : 'p-4'} border-b border-slate-200 dark:border-slate-800 border-r-4 ${isTransit ? 'border-r-secondary' : 'border-r-primary'} flex flex-col justify-center overflow-hidden cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800/80 transition-colors group ${isTransit ? 'bg-slate-50/50 dark:bg-slate-900/40' : 'bg-white dark:bg-slate-900'}`}
                                        onClick={() => onOpenModal({ type: 'edit-segment', segmentId: segment.id })}
                                        title="Click to edit destination/transit"
                                    >
                                        <div className={`flex items-center gap-1.5 font-semibold text-slate-800 dark:text-slate-100 ${isZoomedOut ? 'text-[10px] leading-tight' : ''} overflow-hidden w-full relative`}>
                                            <span className={`shrink-0 ${isTransit ? "text-secondary" : "text-primary"} ${isZoomedOut ? 'scale-75 origin-left' : ''}`}>
                                                {isTransit ? getTransitIcon(segment.method) : <IconMapPin className="w-5 h-5 text-primary" />}
                                            </span>
                                            <span className="truncate" title={segment.name}>{segment.name}</span>
                                        </div>
                                        <div className="flex flex-col mt-0.5 overflow-hidden w-full">
                                            {isTransit && segment.flightNumber && (
                                                <span className={`text-slate-500 dark:text-slate-400 font-mono bg-slate-100 dark:bg-slate-800 rounded w-max truncate max-w-full ${isZoomedOut ? 'text-[8px] px-1 py-0' : 'text-xs px-2 py-0.5 mb-1'}`}>
                                                    {segment.flightNumber}
                                                </span>
                                            )}
                                            {(segment.startDate || segment.endDate) && (
                                                <span className={`text-slate-400 dark:text-slate-500 font-medium truncate w-full ${isZoomedOut ? 'text-[7px] mt-0.5' : 'text-[11px]'}`}>
                                                    {formatDate(parseDate(segment.startDate))} {segment.startTime ? formatTime(segment.startTime) : ''} 
                                                    {' - '}
                                                    {formatDate(parseDate(segment.endDate))} {segment.endTime ? formatTime(segment.endTime) : ''}
                                                </span>
                                            )}
                                        </div>
                                    </div>

                                    {/* Day Columns for this row */}
                                    {timeline.map((date, i) => {
                                        const currentDateStr = dateToString(date);
                                        const isWithinSegment = date >= parseDate(segment.startDate) && date <= parseDate(segment.endDate);
                                        const dayActivities = segment.type === 'city' && segment.activities 
                                            ? segment.activities.filter(a => a.date === currentDateStr).sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'))
                                            : [];

                                        return (
                                            <div key={`${segment.id}-${i}`} 
                                                 onClick={isWithinSegment && !isTransit ? () => onOpenModal({ type: 'add-activity', segmentId: segment.id, date: currentDateStr }) : undefined}
                                                 className={`border-r border-b border-slate-100 dark:border-slate-800 relative min-h-[80px] overflow-hidden
                                                    ${isZoomedOut ? 'p-0.5' : 'p-2'}
                                                    ${isWithinSegment ? (isTransit ? 'bg-pink-50/20 dark:bg-pink-950/10' : 'bg-indigo-50/20 dark:bg-indigo-950/20 cursor-pointer hover:bg-indigo-100/50 dark:hover:bg-indigo-900/30 transition-colors') : 'bg-slate-50/20 dark:bg-slate-950/20'}
                                                 `}
                                                 title={isWithinSegment && !isTransit && !isZoomedOut ? "Click empty area to add activity" : undefined}
                                            >
                                                {isWithinSegment && (
                                                    <div className={`absolute top-0 left-0 w-full h-1 ${isTransit ? 'bg-secondary' : 'bg-primary'}`}></div>
                                                )}

                                                {isWithinSegment && dayActivities.length > 0 && (
                                                    <div className={`flex flex-col gap-1 w-full relative z-20 ${isZoomedOut ? 'mt-1' : 'mt-2'}`}>
                                                        {dayActivities.map(act => (
                                                            <div 
                                                                key={act.id} 
                                                                onClick={(e) => { e.stopPropagation(); onOpenModal({ type: 'edit-activity', segmentId: segment.id, activityId: act.id }); }}
                                                                className={`bg-white dark:bg-slate-800 border shadow-sm rounded overflow-hidden w-full cursor-pointer transition-all hover:shadow-md
                                                                    ${isZoomedOut ? 'p-0.5 border-indigo-50 dark:border-slate-700 hover:border-primary/50' : 'p-1.5 border-indigo-100 dark:border-slate-700 hover:border-primary'}
                                                                `}
                                                                title="Click to edit activity"
                                                            >
                                                                {act.time && <div className={`text-primary font-bold truncate ${isZoomedOut ? 'mb-0 text-[8px]' : 'mb-0.5'}`}>{formatTime(act.time)}</div>}
                                                                <div className={`font-medium text-slate-700 dark:text-slate-200 leading-tight truncate ${isZoomedOut ? 'text-[8px]' : ''}`}>{act.name}</div>
                                                                {!isZoomedOut && act.price > 0 && <div className="text-indigo-500 dark:text-indigo-400 font-semibold mt-0.5">${act.price}</div>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {isWithinSegment && isTransit && (
                                                    <div className="h-full flex items-center justify-center opacity-80">
                                                        {getTransitIcon(segment.method)}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </React.Fragment>
                            );
                        })}

                        {/* Add New City / Travel Row */}
                        <div 
                            className={`sticky-col ${isZoomedOut ? 'p-1.5' : 'p-4'} border-b border-slate-200 dark:border-slate-800 border-r-4 border-r-primary flex flex-col justify-center overflow-hidden cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors bg-white dark:bg-slate-900 text-primary group`}
                            onClick={() => {
                                let startD = '';
                                let startT = '';
                                if (segments.length > 0) {
                                    const latestSeg = [...segments].sort((a, b) => new Date(`${b.endDate}T${b.endTime || '23:59'}`).getTime() - new Date(`${a.endDate}T${a.endTime || '23:59'}`).getTime())[0];
                                    startD = latestSeg.endDate || '';
                                    startT = latestSeg.endTime || '';
                                } else {
                                    startD = dateToString(new Date());
                                }
                                onOpenModal({ type: 'add-segment', startDate: startD, startTime: startT });
                            }}
                            title="Add new city / travel plan"
                        >
                            <div className={`flex items-center gap-2 font-semibold ${isZoomedOut ? 'text-[10px]' : 'text-sm'}`}>
                                <span className={`shrink-0 bg-primary/10 text-primary rounded ${isZoomedOut ? 'p-0.5' : 'p-1'}`}>
                                    <IconPlus />
                                </span>
                                {!isZoomedOut && <span className="truncate">Add new city / travel plan</span>}
                                {isZoomedOut && <span className="truncate">Add Plan</span>}
                            </div>
                        </div>

                        {/* Empty cells for the Add Row */}
                        {timeline.map((date, i) => (
                            <div key={`empty-${i}`} className={`border-r border-b border-slate-200 dark:border-slate-800 bg-slate-50/20 dark:bg-slate-950/20 min-h-[50px] ${isZoomedOut ? 'p-0.5' : 'p-2'}`}></div>
                        ))}
                    </div>
                </div>
            );
        };

        const SegmentManager = ({ segments, onAddSegment, onRemoveSegment, onUpdateSegment }) => {
            const [activeTab, setActiveTab] = useState('city');
            const [isAdding, setIsAdding] = useState(false);

            const [name, setName] = useState('');
            const [startDate, setStartDate] = useState('');
            const [startTime, setStartTime] = useState('');
            const [endDate, setEndDate] = useState('');
            const [endTime, setEndTime] = useState('');
            const [method, setMethod] = useState('flight');
            const [flightNumber, setFlightNumber] = useState('');
            const [price, setPrice] = useState('');

            const handleOpenAddForm = () => {
                if (segments.length > 0) {
                    const latestSeg = [...segments].sort((a, b) => new Date(`${b.endDate}T${b.endTime || '23:59'}`).getTime() - new Date(`${a.endDate}T${a.endTime || '23:59'}`).getTime())[0];
                    setStartDate(latestSeg.endDate || '');
                    setStartTime(latestSeg.endTime || '');
                    setEndDate(latestSeg.endDate || '');
                } else {
                    const todayStr = dateToString(new Date());
                    setStartDate(todayStr);
                    setEndDate(todayStr);
                }
                setIsAdding(true);
            };

            const handleAdd = (e) => {
                e.preventDefault();
                if (!name || !startDate || !endDate) return;

                const newSeg = {
                    id: generateId(),
                    type: activeTab,
                    name,
                    startDate,
                    startTime,
                    endDate,
                    endTime,
                    price: price ? Number(price) : 0,
                    activities: []
                };

                if (activeTab === 'transit') {
                    newSeg.method = method;
                    newSeg.flightNumber = flightNumber;
                }

                onAddSegment(newSeg);
                
                setName(''); setStartDate(''); setStartTime(''); setEndDate(''); setEndTime(''); setFlightNumber(''); setPrice('');
                setIsAdding(false);
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-end mb-2">
                        <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100">Itinerary Details & Activities</h2>
                        {!isAdding && (
                            <button onClick={handleOpenAddForm} className="bg-primary hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-colors">
                                <IconPlus /> Add to Itinerary
                            </button>
                        )}
                    </div>

                    {isAdding && (
                        <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-lg border border-indigo-100 dark:border-slate-800 relative animate-fade-in">
                            <div className="flex gap-4 mb-5 border-b border-slate-200 dark:border-slate-800 pb-2">
                                <button type="button" onClick={() => setActiveTab('city')} className={`pb-2 font-medium text-sm transition-colors border-b-2 ${activeTab === 'city' ? 'border-primary text-primary' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800'}`}>
                                    Add Destination
                                </button>
                                <button type="button" onClick={() => setActiveTab('transit')} className={`pb-2 font-medium text-sm transition-colors border-b-2 ${activeTab === 'transit' ? 'border-secondary text-secondary' : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-800'}`}>
                                    Add Travel / Transit
                                </button>
                            </div>

                            <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                {activeTab === 'city' ? (
                                    <>
                                        <div className="col-span-1 md:col-span-2">
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">City Name</label>
                                            <input type="text" required value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Paris, France" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary focus:ring-1 focus:ring-primary" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Check-in Date & Time</label>
                                            <div className="flex gap-2">
                                                <input type="date" required value={startDate} onChange={e=>{setStartDate(e.target.value); if(!endDate) setEndDate(e.target.value);}} className="w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                                <input type="time" value={startTime} onChange={e=>setStartTime(e.target.value)} className="w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary px-1" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Check-out Date & Time</label>
                                            <div className="flex gap-2">
                                                <input type="date" required value={endDate} onChange={e=>setEndDate(e.target.value)} className="w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                                <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} className="w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary px-1" />
                                            </div>
                                        </div>
                                        <div className="col-span-1 md:col-span-2">
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Accommodation Cost ($)</label>
                                            <input type="number" min="0" value={price} onChange={e=>setPrice(e.target.value)} placeholder="0" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-primary" />
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Method</label>
                                            <select value={method} onChange={e=>setMethod(e.target.value)} className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary">
                                                <option value="flight">Flight</option>
                                                <option value="train">Train</option>
                                                <option value="bus">Bus</option>
                                                <option value="car">Car Rental</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Route / Name</label>
                                            <input type="text" required value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. London to Paris" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Departure Date & Time</label>
                                            <div className="flex gap-2">
                                                <input type="date" required value={startDate} onChange={e=>{setStartDate(e.target.value); if(!endDate) setEndDate(e.target.value);}} className="w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                                <input type="time" value={startTime} onChange={e=>setStartTime(e.target.value)} className="w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary px-1" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Arrival Date & Time</label>
                                            <div className="flex gap-2">
                                                <input type="date" required value={endDate} onChange={e=>setEndDate(e.target.value)} className="w-2/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                                <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} className="w-1/3 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary px-1" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Flight/Train Number (Opt)</label>
                                            <input type="text" value={flightNumber} onChange={e=>setFlightNumber(e.target.value)} placeholder="e.g. BA123" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Total Cost ($)</label>
                                            <input type="number" min="0" value={price} onChange={e=>setPrice(e.target.value)} placeholder="0" className="w-full bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 outline-none focus:border-secondary" />
                                        </div>
                                    </>
                                )}

                                <div className="col-span-1 md:col-span-2 lg:col-span-4 flex justify-end gap-3 mt-2">
                                    <button type="button" onClick={() => setIsAdding(false)} className="px-4 py-2 text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors">Cancel</button>
                                    <button type="submit" className={`px-6 py-2 rounded-lg text-sm font-semibold text-white shadow-sm transition-colors ${activeTab === 'city' ? 'bg-primary hover:bg-indigo-700' : 'bg-secondary hover:bg-pink-600'}`}>
                                        Save {activeTab === 'city' ? 'Destination' : 'Transit'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className="space-y-4">
                        {segments.map((segment) => (
                            <SegmentAccordion 
                                key={segment.id} 
                                segment={segment} 
                                onRemove={() => onRemoveSegment(segment.id)}
                                onUpdate={(updates) => onUpdateSegment(segment.id, updates)}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const SegmentAccordion = ({ segment, onRemove, onUpdate }) => {
            const [isOpen, setIsOpen] = useState(false);
            const isCity = segment.type === 'city';

            const [isEditing, setIsEditing] = useState(false);
            const [editName, setEditName] = useState('');
            const [editStartDate, setEditStartDate] = useState('');
            const [editStartTime, setEditStartTime] = useState('');
            const [editEndDate, setEditEndDate] = useState('');
            const [editEndTime, setEditEndTime] = useState('');
            const [editMethod, setEditMethod] = useState('flight');
            const [editFlightNumber, setEditFlightNumber] = useState('');
            const [editPrice, setEditPrice] = useState('');

            const [actDate, setActDate] = useState(segment.startDate);
            const [actTime, setActTime] = useState('');
            const [actName, setActName] = useState('');
            const [actPrice, setActPrice] = useState('');

            // Keep actDate in sync when segment date changes
            useEffect(() => {
                setActDate(segment.startDate);
            }, [segment.startDate]);

            const startEditing = () => {
                setEditName(segment.name);
                setEditStartDate(segment.startDate);
                setEditStartTime(segment.startTime || '');
                setEditEndDate(segment.endDate);
                setEditEndTime(segment.endTime || '');
                setEditMethod(segment.method || 'flight');
                setEditFlightNumber(segment.flightNumber || '');
                setEditPrice(segment.price !== undefined ? segment.price : '');
                setIsEditing(true);
            };

            const handleEditSave = (e) => {
                e.preventDefault();
                const updates = {
                    name: editName,
                    startDate: editStartDate,
                    startTime: editStartTime,
                    endDate: editEndDate,
                    endTime: editEndTime,
                    price: editPrice ? Number(editPrice) : 0,
                };
                if (!isCity) {
                    updates.method = editMethod;
                    updates.flightNumber = editFlightNumber;
                }
                onUpdate(updates);
                setIsEditing(false);
            };
